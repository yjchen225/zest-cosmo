<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfaf7" />
    <meta name="description" content="COSMO — considered skincare for luminous, lived-in skin." />
    <title>COSMO Skincare</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore paths redirected by public/404.html so GitHub Pages can serve
      // client-side routes such as /zest-cosmo/page-product directly.
      (function restoreGitHubPagesRoute(location) {
        if (location.search.charAt(1) !== "/") return;

        var restored = location.search
          .slice(1)
          .split("&")
          .map(function (segment) { return segment.replace(/~and~/g, "&"); })
          .join("?");

        window.history.replaceState(
          null,
          "",
          location.pathname.slice(0, -1) + restored + location.hash
        );
      })(window.location);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
