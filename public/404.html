<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>COSMO Skincare</title>
    <script>
      // GitHub Pages has no SPA fallback. Preserve the requested route in the
      // query string, load index.html, then restore it before React starts.
      (function redirectToApp(location) {
        var pathSegmentsToKeep = 1;
        var basePath = location.pathname
          .split("/")
          .slice(0, 1 + pathSegmentsToKeep)
          .join("/");
        var route = location.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/")
          .replace(/&/g, "~and~");
        var query = location.search
          ? "&" + location.search.slice(1).replace(/&/g, "~and~")
          : "";

        location.replace(
          location.protocol + "//" + location.host + basePath + "/?/" +
          route + query + location.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
